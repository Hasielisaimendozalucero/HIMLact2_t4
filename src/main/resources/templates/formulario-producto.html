<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Producto</title>
</head>
<body>
    <h1 th:text="${nombreProyecto}"></h1>
    <h2>Registrar Producto</h2>

    <form th:action="@{/productos/guardar}" th:object="${productoDTO}" method="post">
        <label>Nombre:</label><br>
        <input type="text" th:field="*{nombre}" required><br><br>

        <label>Precio:</label><br>
        <input type="number" step="0.01" th:field="*{precio}" required><br><br>

        <label>Categoría:</label><br>
        <input type="text" th:field="*{categoria}" required><br><br>

        <button type="submit">Guardar Producto</button>
    </form>
    <br>
    <a href="/productos">Volver a la lista</a>
</body>
</html>
